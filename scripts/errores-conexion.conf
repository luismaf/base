# errores-conexion.conf — huellas en pantalla que significan "el dev no está
# recibiendo", no "el dev contestó que no".
#
# El dueño lo describió así: no es que no llegue a la API, es como que la
# RECHAZA. Y descubrió la cura: sesión nueva (/new) + "hola" + esperar la
# respuesta. Después de eso siempre funciona. En cambio tirarle una chorrera
# inmensa apenas abrís el chat lo bloquea y no contesta más.
#
# Una línea = una expresión regular extendida (grep -E), sin distinguir
# mayúsculas. Se comparan contra las últimas líneas de la pantalla del panel.
# Las líneas vacías y las que empiezan con # se ignoran.
#
# CUIDADO CON LOS NÚMEROS SUELTOS. La pantalla de un panel tiene código,
# diffs y contadores de tokens: un patrón `429` a secas matchea un número de
# línea y manda a rescatar a un panel que está trabajando bien. Por eso los
# códigos HTTP van SIEMPRE pegados a una palabra de error.

connection error
connection closed
connection refused
econnreset
econnrefused
etimedout
epipe
socket hang up
fetch failed
network error
apiconnectionerror
ai_apicallerror
ai_retryerror
und_err
stream (error|closed unexpectedly)
request (failed|aborted|timed out)
failed after [0-9]+ (attempts|retries)
(error|status|http)[^0-9]{0,12}(401|403|429|500|502|503|504)
(401|403|429|500|502|503|504)[^0-9]{0,4}(unauthorized|forbidden|too many requests|internal server error|bad gateway|service unavailable|gateway timeout)
rate.?limit(ed|s)? (exceeded|reached)
overloaded_error
provider (error|unavailable)
no (provider|model) (configured|available)
authentication (failed|error)
invalid api key
